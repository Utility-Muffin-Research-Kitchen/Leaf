# One-time backfill: post all existing GitHub releases to the Discord #releases channel.
# Trigger manually from the Actions tab (Run workflow). Reuses DISCORD_RELEASE_WEBHOOK.
# Posts oldest -> newest, no role ping. Delete this file after you've run it once.

name: Discord backfill releases

on:
  workflow_dispatch:
    inputs:
      include_prereleases:
        description: "Include pre-releases?"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Post existing releases to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          REPO: ${{ github.repository }}
          INCLUDE_PRE: ${{ inputs.include_prereleases }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK secret not set" >&2
            exit 1
          fi

          # All releases, paginated, oldest first, drafts excluded.
          gh api --paginate "repos/$REPO/releases" \
            | jq -c 'sort_by(.published_at) | .[] | select(.draft==false)' > /tmp/rel.ndjson

          count=0
          while IFS= read -r rel; do
            pre=$(jq -r '.prerelease' <<<"$rel")
            if [ "$pre" = "true" ] && [ "$INCLUDE_PRE" != "true" ]; then
              echo "skip (pre-release): $(jq -r '.tag_name' <<<"$rel")"
              continue
            fi

            tag=$(jq -r '.tag_name' <<<"$rel")
            # Build payload with jq (unicode-safe slicing, safe escaping). No pings.
            payload=$(jq -c '{
              content: ("📦 **" + .tag_name + "**"),
              allowed_mentions: {parse: []},
              embeds: [{
                title: (.name // .tag_name),
                url: .html_url,
                description: (((.body // "") | if . == "" then "_No release notes._" else . end) | .[0:3900]),
                color: 5763719
              }]
            }' <<<"$rel")

            code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
              -H 'Content-Type: application/json' -X POST "$WEBHOOK" -d "$payload")
            echo "$tag -> HTTP $code"
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then
              cat /tmp/resp; echo
            fi

            count=$((count + 1))
            sleep 1.5   # stay under Discord's webhook rate limit
          done < /tmp/rel.ndjson

          echo "Done. Posted $count releases."
